name: Auto Linter

on:
  push:
    paths: "*.py"
      
jobs:
  code:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout/clone the code
        uses: actions/checkout@v7
      
      - name: Install Linter
        run: pip install ruff 
      
      - name: checking the code
        run: ruff check . --fix
        
      - name: Checking the code again
        run: ruff check . 
      
  
  
